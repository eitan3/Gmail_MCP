[project]
name = "gmail-mcp"
version = "0.2.0"
description = "Multi-account Gmail + Google Calendar MCP server (stdio) with env-var-only OAuth credentials."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eitan Hadar" }]
keywords = ["gmail", "mcp", "model-context-protocol", "email"]

dependencies = [
    "mcp>=1.27",
    "google-api-python-client>=2.197",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"
gmail-mcp-auth = "gmail_mcp.bootstrap_auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]
